name: saga-pattern

x-kafka: &kafka
  image: apache/kafka:4.0.0
  healthcheck:
    test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null 2>&1"]
    interval: 10s
    timeout: 10s
    retries: 20
    start_period: 20s

x-kafka-environment: &kafka-environment
  CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
  KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
  KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_NUM_PARTITIONS: 3
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_LOG_DIRS: /var/lib/kafka/data
  KAFKA_HEAP_OPTS: -Xms128m -Xmx256m

x-mysql: &mysql
  image: mysql:8.4
  command: ["--performance-schema=OFF", "--innodb-buffer-pool-size=64M"]
  healthcheck:
    test: ["CMD-SHELL", "MYSQL_PWD=admin mysql --protocol=TCP -h 127.0.0.1 -u admin -e 'SELECT 1' >/dev/null 2>&1"]
    interval: 10s
    timeout: 5s
    retries: 20
    start_period: 30s

x-mysql-environment: &mysql-environment
  MYSQL_USER: admin
  MYSQL_PASSWORD: admin
  MYSQL_ROOT_PASSWORD: admin

x-app-environment: &app-environment
  SERVER_PORT: "8080"
  KAFKA_BOOTSTRAP_SERVERS: kafka-1:19092,kafka-2:19092,kafka-3:19092
  SPRING_DATASOURCE_USERNAME: admin
  SPRING_DATASOURCE_PASSWORD: admin
  JAVA_TOOL_OPTIONS: -Xms64m -Xmx256m

x-app: &app
  environment: *app-environment
  depends_on: &app-dependencies
    kafka-1:
      condition: service_healthy
    kafka-2:
      condition: service_healthy
    kafka-3:
      condition: service_healthy

services:
  kafka-1:
    <<: *kafka
    hostname: kafka-1
    ports:
      - "29092:9092"
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:19092,PLAINTEXT_HOST://localhost:29092
    volumes:
      - kafka-1-data:/var/lib/kafka/data

  kafka-2:
    <<: *kafka
    hostname: kafka-2
    ports:
      - "39092:9092"
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:19092,PLAINTEXT_HOST://localhost:39092
    volumes:
      - kafka-2-data:/var/lib/kafka/data

  kafka-3:
    <<: *kafka
    hostname: kafka-3
    ports:
      - "49092:9092"
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:19092,PLAINTEXT_HOST://localhost:49092
    volumes:
      - kafka-3-data:/var/lib/kafka/data

  order-db:
    <<: *mysql
    environment:
      <<: *mysql-environment
      MYSQL_DATABASE: order_db
    ports:
      - "13306:3306"
    volumes:
      - order-db-data:/var/lib/mysql

  inventory-db:
    <<: *mysql
    environment:
      <<: *mysql-environment
      MYSQL_DATABASE: inventory_db
    ports:
      - "13316:3306"
    volumes:
      - inventory-db-data:/var/lib/mysql

  payment-db:
    <<: *mysql
    environment:
      <<: *mysql-environment
      MYSQL_DATABASE: payment_db
    ports:
      - "13326:3306"
    volumes:
      - payment-db-data:/var/lib/mysql

  shipping-db:
    <<: *mysql
    environment:
      <<: *mysql-environment
      MYSQL_DATABASE: shipping_db
    ports:
      - "13336:3306"
    volumes:
      - shipping-db-data:/var/lib/mysql

  order-1:
    <<: *app
    environment:
      <<: *app-environment
      SPRING_DATASOURCE_URL: jdbc:mysql://order-db:3306/order_db
      INVENTORY_BASE_URLS: http://inventory-1:8080,http://inventory-2:8080,http://inventory-3:8080
      PAYMENT_BASE_URLS: http://payment-1:8080,http://payment-2:8080,http://payment-3:8080
      SHIPPING_BASE_URLS: http://shipping-1:8080,http://shipping-2:8080,http://shipping-3:8080
      ORDER_CANCEL_ALLOWED_FOR: ${ORDER_CANCEL_ALLOWED_FOR:-7d}
    depends_on:
      <<: *app-dependencies
      order-db:
        condition: service_healthy
    build:
      context: .
      args:
        SERVICE: order-service
    image: saga-pattern/order-service:local
    ports:
      - "18080:8080"

  order-2:
    <<: *app
    environment:
      <<: *app-environment
      SPRING_DATASOURCE_URL: jdbc:mysql://order-db:3306/order_db
      INVENTORY_BASE_URLS: http://inventory-1:8080,http://inventory-2:8080,http://inventory-3:8080
      PAYMENT_BASE_URLS: http://payment-1:8080,http://payment-2:8080,http://payment-3:8080
      SHIPPING_BASE_URLS: http://shipping-1:8080,http://shipping-2:8080,http://shipping-3:8080
      ORDER_CANCEL_ALLOWED_FOR: ${ORDER_CANCEL_ALLOWED_FOR:-7d}
    depends_on:
      <<: *app-dependencies
      order-db:
        condition: service_healthy
    build:
      context: .
      args:
        SERVICE: order-service
    image: saga-pattern/order-service:local
    ports:
      - "18081:8080"

  order-3:
    <<: *app
    environment:
      <<: *app-environment
      SPRING_DATASOURCE_URL: jdbc:mysql://order-db:3306/order_db
      INVENTORY_BASE_URLS: http://inventory-1:8080,http://inventory-2:8080,http://inventory-3:8080
      PAYMENT_BASE_URLS: http://payment-1:8080,http://payment-2:8080,http://payment-3:8080
      SHIPPING_BASE_URLS: http://shipping-1:8080,http://shipping-2:8080,http://shipping-3:8080
      ORDER_CANCEL_ALLOWED_FOR: ${ORDER_CANCEL_ALLOWED_FOR:-7d}
    depends_on:
      <<: *app-dependencies
      order-db:
        condition: service_healthy
    build:
      context: .
      args:
        SERVICE: order-service
    image: saga-pattern/order-service:local
    ports:
      - "18082:8080"

  inventory-1:
    <<: *app
    environment:
      <<: *app-environment
      SPRING_DATASOURCE_URL: jdbc:mysql://inventory-db:3306/inventory_db
    depends_on:
      <<: *app-dependencies
      inventory-db:
        condition: service_healthy
    build:
      context: .
      args:
        SERVICE: inventory-service
    image: saga-pattern/inventory-service:local
    ports:
      - "18090:8080"

  inventory-2:
    <<: *app
    environment:
      <<: *app-environment
      SPRING_DATASOURCE_URL: jdbc:mysql://inventory-db:3306/inventory_db
    depends_on:
      <<: *app-dependencies
      inventory-db:
        condition: service_healthy
    build:
      context: .
      args:
        SERVICE: inventory-service
    image: saga-pattern/inventory-service:local
    ports:
      - "18091:8080"

  inventory-3:
    <<: *app
    environment:
      <<: *app-environment
      SPRING_DATASOURCE_URL: jdbc:mysql://inventory-db:3306/inventory_db
    depends_on:
      <<: *app-dependencies
      inventory-db:
        condition: service_healthy
    build:
      context: .
      args:
        SERVICE: inventory-service
    image: saga-pattern/inventory-service:local
    ports:
      - "18092:8080"

  payment-1:
    <<: *app
    environment:
      <<: *app-environment
      SPRING_DATASOURCE_URL: jdbc:mysql://payment-db:3306/payment_db
      PAYMENT_GATEWAY_APPROVE_DELAY: ${PAYMENT_GATEWAY_APPROVE_DELAY:-0s}
    depends_on:
      <<: *app-dependencies
      payment-db:
        condition: service_healthy
    build:
      context: .
      args:
        SERVICE: payment-service
    image: saga-pattern/payment-service:local
    ports:
      - "18100:8080"

  payment-2:
    <<: *app
    environment:
      <<: *app-environment
      SPRING_DATASOURCE_URL: jdbc:mysql://payment-db:3306/payment_db
      PAYMENT_GATEWAY_APPROVE_DELAY: ${PAYMENT_GATEWAY_APPROVE_DELAY:-0s}
    depends_on:
      <<: *app-dependencies
      payment-db:
        condition: service_healthy
    build:
      context: .
      args:
        SERVICE: payment-service
    image: saga-pattern/payment-service:local
    ports:
      - "18101:8080"

  payment-3:
    <<: *app
    environment:
      <<: *app-environment
      SPRING_DATASOURCE_URL: jdbc:mysql://payment-db:3306/payment_db
      PAYMENT_GATEWAY_APPROVE_DELAY: ${PAYMENT_GATEWAY_APPROVE_DELAY:-0s}
    depends_on:
      <<: *app-dependencies
      payment-db:
        condition: service_healthy
    build:
      context: .
      args:
        SERVICE: payment-service
    image: saga-pattern/payment-service:local
    ports:
      - "18102:8080"

  shipping-1:
    <<: *app
    environment:
      <<: *app-environment
      SPRING_DATASOURCE_URL: jdbc:mysql://shipping-db:3306/shipping_db
    depends_on:
      <<: *app-dependencies
      shipping-db:
        condition: service_healthy
    build:
      context: .
      args:
        SERVICE: shipping-service
    image: saga-pattern/shipping-service:local
    ports:
      - "18110:8080"

  shipping-2:
    <<: *app
    environment:
      <<: *app-environment
      SPRING_DATASOURCE_URL: jdbc:mysql://shipping-db:3306/shipping_db
    depends_on:
      <<: *app-dependencies
      shipping-db:
        condition: service_healthy
    build:
      context: .
      args:
        SERVICE: shipping-service
    image: saga-pattern/shipping-service:local
    ports:
      - "18111:8080"

  shipping-3:
    <<: *app
    environment:
      <<: *app-environment
      SPRING_DATASOURCE_URL: jdbc:mysql://shipping-db:3306/shipping_db
    depends_on:
      <<: *app-dependencies
      shipping-db:
        condition: service_healthy
    build:
      context: .
      args:
        SERVICE: shipping-service
    image: saga-pattern/shipping-service:local
    ports:
      - "18112:8080"

  order-lb:
    image: nginx:1.29-alpine
    depends_on:
      - order-1
      - order-2
      - order-3
    volumes:
      - ./nginx/order-lb.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "18000:80"

volumes:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
  order-db-data:
  inventory-db-data:
  payment-db-data:
  shipping-db-data:
